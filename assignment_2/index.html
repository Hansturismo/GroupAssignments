<!-- Declare the document type as HTML5. -->
<!doctype html>
<html lang="en">
    <head>
        <!-- Specify the character encoding. -->
        <meta charset="UTF-8" />
        <!-- Adjust the page size for different screens. -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Load the CSS reset and main stylesheet. -->
        <link href="./css/reset.css" rel="stylesheet" />
        <link href="./css/variables.css" rel="stylesheet" />
        <link href="./css/styles.css" rel="stylesheet" />
        <!-- Set the favicon displayed in the browser tab. -->
        <link rel="icon" type="image/x-icon" href="./assets/icons/favicon.ico" />
        <!-- Connect to Google Fonts and load the Outfit font family. -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <!-- Load JavaScript after the HTML document has been parsed. -->
        <script src="./js/images.js" defer></script>
        <script src="./js/app.js" defer></script>
        <!-- Set the title displayed in the browser tab. -->
        <title>Photo Slideshow</title>
    </head>
    <body>
        <!-- Define the main content of the page. -->
        <main>
            <!-- Create a section for the slideshow. -->
            <section class="slideshow" aria-label="Photo slideshow">
                <!-- Group the image with its caption and source. -->
                <figure class="slideFigure">
                    <!-- Create a container for the image. -->
                    <div class="imageStage">
                        <!-- Display the slideshow image. -->
                        <img id="slideImage" alt="" />
                    </div>
                    <!-- Group the image description and reference link. -->
                    <figcaption class="figcaptionContainer">
                        <!-- Display the fruit name -->
                         <h2 class="imageTitle"></h2>
                        <!-- Display the image description. -->
                        <p class="imageCaption"></p>
                        <!-- Display a reference link about the fruit. -->
                        <p class="imageSource">
                            <a href=""></a>
                        </p>
                    </figcaption>
                </figure>
                <!-- Display the current image number and total number of images. -->
                <span class="imageCounter">
                    <!-- Display the current image number. -->
                    <span id="slideNumber">01</span>
                    <!-- Separate the current image number from the total. -->
                    <span class="counterSeparator">/</span>
                    <!-- Display the total number of images. -->
                    <span id="slideTotal">08</span>
                </span>
                <!-- Create a panel for the slideshow controls. -->
                <div class="controlPanel">
                    <div class="progressZone">
                        <div class="progressTrack">
                            <div id="progressFill" class="progressFill"></div>
                        </div>
                    </div>
                    <!-- Group the slideshow navigation buttons. -->
                    <div class="arrowButtons">
                        <!-- Go to the previous image. -->
                        <button class="previousButton" type="button">Previous</button>
                        <!-- Go to the next image. -->
                        <button class="nextButton" type="button">Next</button>
                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
