<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link href="./css/styles.css" rel="stylesheet" />
        <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" />
        <script src="./js/app.js" defer></script>
        <title>Document</title>
    </head>
    <body>
        <main>
            <section class="slideshow" aria-label="slidehow">
                <figure class="slideFigure">
                    
                    <div class="imageContainer"> 
                        <img id="slideImage" src="" alt="">

                    </div>
                    <figcaption class="imageCaption">
                        <p class="slideCaption"></p>
                        <span class="imageCounter">
                            <span id="slideNumber">01</span>
                            <span class="counterSeperator">/</span>
                            <span id="slideTotal">08</span>
                        </span>
                        
                    </figcaption>
                    <div class="controlPanel">
                        <div class="progressZone">
                            <div class="progressTrack">
                                <div id="progressFill" class="progressFill"></div>
                            </div>
                        </div>

                        <div class="arrowButtons">
                            <button class="previousButton" type="button"></button>
                            <button class="nextButton" type="button"></button>
                        </div>
                    </div>
                
                    
                    <div class="sources">
                        <p>https://en.wikipedia.org/wiki/Dragon_fruit</p>
                        <p>https://www.jurassicfruit.com/en/products/passionfruit-red?variant=44885794783289</p>
                        <p>https://tropicalfruitparadise.com/ro-ro/products/papaya-bio</p>
                        <p>https://www.britannica.com/topic/carambola</p>
                        <p>https://www.britannica.com/plant/litchi-fruit</p>
                        <p>https://www.webmd.com/diet/health-benefits-rambutan</p>
                        <p>
                            https://quillandpad.com/2023/02/13/durian-the-king-of-fruits-absolutely-delicious-but-the-smell-is-unforgettable-and-thats-putting-it-mildly/
                        </p>
                        <p>https://www.amazon.in/Taiwan-Guava-Healthy-Grafted-Growing/dp/B0H4H1XL3X</p>
                    </div>
                </figure>
            </section>
        </main>
    </body>
</html>
